appId: io.github.simpez.hopper
productName: Hopper
copyright: Copyright © 2026

directories:
  buildResources: resources
  output: dist

# electron-vite emits everything the app needs into out/. Node deps (pg, mysql2,
# xlsx) stay external, so node_modules is packed too — all three are pure JS,
# no native rebuild required.
files:
  - out/**/*
  - package.json

asar: true

# main/index.ts loads the BrowserWindow icon from process.resourcesPath. macOS gets its
# icon from the bundle regardless, but Linux window managers need this file to exist.
extraResources:
  - from: resources/icon.png
    to: icon.png

mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # No Apple Developer ID: ad-hoc sign so the arm64 binary can launch locally.
  # Hardened runtime must be off when not properly signed, or the app won't start.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: resources/icon.png
  category: Development
  synopsis: Database client with per-connection pre-connection scripts
  description: >-
    Desktop database client for PostgreSQL and MySQL instances that are only reachable
    after a pre-connection script, such as a kubectl port-forward or an SSH tunnel.
  maintainer: sim-pez <sim-pez@users.noreply.github.com>
  executableName: hopper
  desktop:
    entry:
      # Lets window managers match the window to the .desktop icon.
      StartupWMClass: Hopper
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]

deb:
  # Electron's runtime deps; libsecret backs safeStorage (see README).
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
